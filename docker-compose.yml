services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: doc-heartbeat-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: doc-heartbeat-app
    environment:
      - ELASTICSEARCH_URI=http://elasticsearch:9200
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data: